services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: supersede
      POSTGRES_PASSWORD: supersede
      POSTGRES_USER: supersede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supersede -d supersede"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${R2_ACCESS_KEY_ID:-minioadmin} ${R2_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${R2_BUCKET:-supersede-development};
      mc mb --ignore-existing --with-lock local/supersede-audit-development;
      mc anonymous set none local/${R2_BUCKET:-supersede-development};
      mc anonymous set none local/supersede-audit-development;
      "

volumes:
  postgres-data:
  minio-data:
