services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: supersede
      POSTGRES_PASSWORD: supersede
      POSTGRES_USER: supersede
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supersede -d supersede"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/supersede-development;
      mc mb --ignore-existing --with-lock local/supersede-audit-development;
      mc anonymous set none local/supersede-development;
      mc anonymous set none local/supersede-audit-development;
      "

volumes:
  postgres-data:
  minio-data:
